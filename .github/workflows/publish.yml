name: Publish Package

on:
  push:
    branches:
      - main # Trigger on every push to main
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: read
  packages: write # Need write to publish, read is implied

jobs:
  publish:
    runs-on: ${{ fromJSON(vars.CI_RUNNER) }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: https://npm.pkg.github.com
          scope: '@wolffm'
        env:
          # Use HADOKU_SITE_TOKEN for cross-repo package access
          NODE_AUTH_TOKEN: ${{ secrets.HADOKU_NPM_READ_TOKEN }}

      # pnpm via corepack, pinned by the `packageManager` field in package.json.
      # Replaces pnpm/action-setup, whose self-installer intermittently died on
      # this self-hosted runner with `ENOENT ... uv_cwd` (cwd removed mid-install).
      # No pnpm cache needed: the store is already warm on the persistent runner.
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.5.0 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm --config.store-dir=${{ runner.tool_cache }}/pnpm-store install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.HADOKU_NPM_READ_TOKEN }}

      - name: Build package
        run: pnpm run build

      - name: Check if package changed
        id: package_changed
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -q .; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "✓ Package has changes"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "✗ No changes in package"
          fi

      - name: Check and bump version if needed
        if: steps.package_changed.outputs.changed == 'true'
        run: |
          # Get package name and current version from package.json
          package_name=$(node -p "require('./package.json').name")
          current_version=$(node -p "require('./package.json').version")
          echo "Current version: $current_version"

          # START FROM THE REGISTRY, NOT FROM package.json.
          #
          # The bump below is written into the runner's workspace and published,
          # but never committed back to main. So package.json here is frozen
          # while the registry marches on, and this loop used to re-walk the
          # whole gap one patch at a time, from scratch, on every single run.
          #
          # tenhands hit the wall first, on 2026-08-05: its package.json said
          # 1.14.5, the registry was past 1.18.20, and walking that gap is 99
          # steps. It exhausted a 100-attempt cap and published nothing. This
          # workflow has the identical shape with a cap of 50, so it fails at
          # half the drift — it was simply further from the edge.
          latest_published=$(pnpm view "${package_name}" version 2>/dev/null || echo "")
          if [ -n "$latest_published" ]; then
            echo "Latest published in registry: $latest_published"
            # Whichever is higher wins, so a version already bumped past the
            # registry is not dragged backwards.
            check_version=$(printf '%s\n%s\n' "$current_version" "$latest_published" \
                              | sort -V | tail -1)
          else
            echo "No published version found; starting from package.json"
            check_version="$current_version"
          fi
          echo "Starting version check at: $check_version"
          check_version_start="$check_version"

          # Now genuinely a retry rather than a catch-up, so 10 is generous.
          max_attempts=10
          attempt=0

          while pnpm view "${package_name}@${check_version}" version 2>/dev/null; do
            echo "⚠️  Version $check_version already published, bumping version..."
            
            # Parse version
            major=$(echo $check_version | cut -d. -f1)
            minor=$(echo $check_version | cut -d. -f2)
            patch=$(echo $check_version | cut -d. -f3)
            
            # Rollover at .20 to keep patch numbers manageable (matching pre-commit hook)
            # -ge, not -eq: an exact match leaves anything past .20
            # incrementing forever instead of rolling over.
            if [ $patch -ge 20 ]; then
              check_version="$major.$((minor + 1)).0"
              echo "🚀 Rolling over to minor version: $check_version"
            else
              check_version="$major.$minor.$((patch + 1))"
              echo "📈 Incrementing patch version: $check_version"
            fi
            
            attempt=$((attempt + 1))
            if [ $attempt -ge $max_attempts ]; then
              echo "❌ Error: Reached maximum version bump attempts ($max_attempts)."
              echo "   Started at $check_version_start (package.json:" \
                   "$current_version, registry: ${latest_published:-<unreadable>})."
              echo "   From the registry's latest this should take one step, so"
              echo "   this many collisions means the lookup failed and it fell"
              echo "   back to the stale committed version."
              exit 1
            fi
          done

          if [ "$check_version" != "$current_version" ]; then
            # Update package.json with new version
            node -e "const fs = require('fs'); const p = 'package.json'; const src = fs.readFileSync(p, 'utf8'); const next = src.replace(/(\"version\"\s*:\s*\")[^\"]*(\")/, (m, a, b) => a + process.argv[1] + b); if (next === src) { console.error('could not patch version in ' + p); process.exit(1); } fs.writeFileSync(p, next);" "$check_version"
            
            echo "✅ Version bumped: $current_version → $check_version"
            
            # Update lock file
            pnpm --config.store-dir=${{ runner.tool_cache }}/pnpm-store install --lockfile-only
          else
            echo "✓ Version $current_version is not published yet"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.HADOKU_NPM_READ_TOKEN }}

      - name: Publish package
        if: steps.package_changed.outputs.changed == 'true'
        run: pnpm publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Notify parent app to update dependencies
      - name: Notify parent about package update
        if: steps.package_changed.outputs.changed == 'true'
        env:
          HADOKU_SITE_TOKEN: ${{ secrets.HADOKU_SITE_TOKEN }}
        run: |
          echo "Notifying hadoku_site about package update..."

          if [ -z "$HADOKU_SITE_TOKEN" ]; then
            echo "⚠️  Warning: HADOKU_SITE_TOKEN not available, skipping notification"
            exit 0
          fi

          payload=$(cat <<EOF
            {
              "event_type": "packages_updated",
              "client_payload": {
                "packages": ["@wolffm/resume-bot"],
                "sha": "${{ github.sha }}",
                "ref": "${{ github.ref }}"
              }
            }
          EOF
          )

          status_code=$(curl -sS \
            -o /dev/null \
            -w "%{http_code}" \
            -X POST "https://api.github.com/repos/WolffM/hadoku_site/dispatches" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $HADOKU_SITE_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d "$payload")

          if [ "$status_code" = "204" ]; then
            echo "✅ Notified hadoku_site about package update"
          else
            echo "⚠️  Failed to notify hadoku_site (HTTP $status_code)"
          fi
