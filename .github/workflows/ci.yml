name: CI

# This repo had NO pull-request CI. `publish.yml` and `update-wolffm.yml` run on
# push to main, `vibecheck.yml` is workflow_dispatch only — so nothing has ever
# verified a pull request here.
#
# The commands are the ones already in package.json: `typecheck` (tsc --noEmit)
# and `lint` + `lint:css` (eslint, stylelint). Nothing invented.
#
# DELIBERATELY UNFILTERED on pull_request. A required check that never runs
# never reports, and auto-merge waits only on required checks — so a `paths:`
# filter is a gate that is ABSENT on some PRs (they merge with nothing
# verified) and FATAL on others (they wait forever). Scoping lives in the jobs'
# scope steps below, which always report. See tenhands
# docs/hadoku-task-automation/pr-gate-invariant.md.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  typecheck:
    name: typecheck
    # HOSTED, DELIBERATELY — do not point this workflow at the self-hosted
    # builder, and do not restore the `vars.CI_RUNNER || ...` fallback here.
    #
    # This repo is public and this is the only fork-triggerable workflow
    # (`pull_request` above). The workflow file comes from the base branch, so a
    # fork cannot edit these steps — but `pnpm install` and the `pnpm run` gates
    # execute scripts out of the PR's own package.json. On the self-hosted
    # builder that is arbitrary code as the runner's user, with its home
    # directory, credentials and other checkouts in reach.
    #
    # Hardcoded rather than defaulted because `CI_RUNNER` is a plausible thing
    # to set for speed later, and doing so would silently reopen that path.
    # publish / update-wolffm / vibecheck are not fork-reachable and still
    # honour CI_RUNNER.
    # Runner SELECTION, not a job-level `if:`. Skipping the job would make a
    # required check that never reports, so a fork PR could never merge. This
    # keeps it always-running while an unauthorized fork PR lands on
    # GitHub-hosted (free here) instead of a claw — a persistent machine on a
    # home LAN. author_association is computed by GitHub, not the submitter.
    # Runner SELECTION, not a job-level `if:`. Skipping the job would make a
    # required check that never reports, so a fork PR could never merge. This
    # keeps it always-running while an unauthorized fork PR lands on
    # GitHub-hosted (free here) instead of a claw — a persistent machine on a
    # home LAN. author_association is computed by GitHub, not the submitter.
    runs-on: ${{ fromJSON((github.event_name == 'pull_request' && !contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association) && '["ubuntu-latest"]') || vars.CI_RUNNER) }}
    timeout-minutes: 15
    steps:
      # fetch-depth: 0 — the scope step diffs against the PR base, and a shallow
      # clone has no common ancestor to diff with.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Does this diff need typechecking?
        id: scope
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed="$(git diff --name-only \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}")"
          echo "changed files:"; echo "$changed" | sed 's/^/  /'
          if echo "$changed" | grep -qE '^(src/|worker/|builder/|scripts/|.*tsconfig.*\.json|package\.json|pnpm-lock\.yaml|vite\.config\.ts|\.github/workflows/ci\.yml)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "→ no TypeScript sources touched; nothing for tsc to check."
          fi

      # setup-node BEFORE corepack — the order is load-bearing, and publish.yml
      # already has it. `corepack enable` symlinks its shims next to the active
      # node, and without setup-node that is the host's /usr/bin, which the
      # runner user cannot write.
      - uses: actions/setup-node@v6
        if: steps.scope.outputs.run == 'true'
        with:
          node-version: '22'
          registry-url: https://npm.pkg.github.com
          scope: '@wolffm'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.HADOKU_NPM_READ_TOKEN }}

      # corepack, not pnpm/action-setup — see publish.yml: the self-installer
      # intermittently died on this runner with `ENOENT ... uv_cwd`.
      - name: Enable pnpm
        if: steps.scope.outputs.run == 'true'
        run: |
          corepack enable
          corepack prepare pnpm@11.5.0 --activate

      # store-dir pinned to the tool cache, matching publish.yml — the store is
      # already warm on this persistent runner.
      - name: Install
        if: steps.scope.outputs.run == 'true'
        run: pnpm --config.store-dir=${{ runner.tool_cache }}/pnpm-store install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.HADOKU_NPM_READ_TOKEN }}

      - name: Typecheck
        if: steps.scope.outputs.run == 'true'
        run: pnpm run typecheck

  lint:
    name: lint
    # Hosted, deliberately — see the typecheck job above.
    # Runner SELECTION, not a job-level `if:`. Skipping the job would make a
    # required check that never reports, so a fork PR could never merge. This
    # keeps it always-running while an unauthorized fork PR lands on
    # GitHub-hosted (free here) instead of a claw — a persistent machine on a
    # home LAN. author_association is computed by GitHub, not the submitter.
    # Runner SELECTION, not a job-level `if:`. Skipping the job would make a
    # required check that never reports, so a fork PR could never merge. This
    # keeps it always-running while an unauthorized fork PR lands on
    # GitHub-hosted (free here) instead of a claw — a persistent machine on a
    # home LAN. author_association is computed by GitHub, not the submitter.
    runs-on: ${{ fromJSON((github.event_name == 'pull_request' && !contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association) && '["ubuntu-latest"]') || vars.CI_RUNNER) }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Does this diff need linting?
        id: scope
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed="$(git diff --name-only \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}")"
          echo "changed files:"; echo "$changed" | sed 's/^/  /'
          if echo "$changed" | grep -qE '^(src/|worker/|builder/|scripts/|eslint\.config\.js|\.stylelintrc\.cjs|package\.json|pnpm-lock\.yaml|\.github/workflows/ci\.yml)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "→ no lintable sources touched; nothing for eslint or stylelint to read."
          fi

      - uses: actions/setup-node@v6
        if: steps.scope.outputs.run == 'true'
        with:
          node-version: '22'
          registry-url: https://npm.pkg.github.com
          scope: '@wolffm'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.HADOKU_NPM_READ_TOKEN }}

      - name: Enable pnpm
        if: steps.scope.outputs.run == 'true'
        run: |
          corepack enable
          corepack prepare pnpm@11.5.0 --activate

      - name: Install
        if: steps.scope.outputs.run == 'true'
        run: pnpm --config.store-dir=${{ runner.tool_cache }}/pnpm-store install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.HADOKU_NPM_READ_TOKEN }}

      - name: ESLint
        if: steps.scope.outputs.run == 'true'
        run: pnpm run lint

      - name: Stylelint
        if: steps.scope.outputs.run == 'true'
        run: pnpm run lint:css
